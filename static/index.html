<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Support Ticket Classifier</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>

<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #e2e4e9;
    --text: #16181d;
    --text-muted: #6b7280;
    --text-faint: #9aa1ac;
    --focus-ring: #1f2933;

    --font-sans: "Inter", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;

    /* one accent for a confident prediction, one for "needs review" --
       with 77 possible categories there's no sane way to hand-pick a
       color per class like the old 4-category version did */
    --ok-text: #115e59;
    --ok-bg: #ccfbf1;
    --ok-border: #94ede1;
    --ok-accent: #2dd4bf;

    --review-text: #92400e;
    --review-bg: #fef3c7;
    --review-border: #f3d38a;
    --review-accent: #d69a2d;
  }

  * { box-sizing: border-box; }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 48px 20px 32px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  main {
    width: 100%;
    max-width: 640px;
  }

  .header {
    text-align: center;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 8px;
  }

  h1 {
    font-family: var(--font-mono);
    font-size: 1.3rem;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .subhead {
    font-size: 0.9rem;
    color: var(--text-muted);
    margin: 0 0 24px;
    line-height: 1.5;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
  }

  .section-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 10px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .chip {
    font-family: var(--font-sans);
    font-size: 0.8rem;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    cursor: pointer;
    transition: filter 0.12s ease;
  }

  .chip:hover { filter: brightness(0.97); }
  .chip:active { filter: brightness(0.93); }

  textarea {
    width: 100%;
    height: 110px;
    font-family: var(--font-sans);
    font-size: 0.92rem;
    line-height: 1.5;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    resize: vertical;
    color: var(--text);
    background: var(--surface);
  }

  textarea::placeholder { color: var(--text-faint); }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 14px;
  }

  button#submitBtn {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #fff;
    background: var(--focus-ring);
    border: none;
    border-radius: 7px;
    padding: 11px 20px;
    cursor: pointer;
    transition: background 0.12s ease, opacity 0.12s ease;
  }

  button#submitBtn:hover:not(:disabled) { background: #2d3542; }
  button#submitBtn:disabled { opacity: 0.6; cursor: default; }

  .hint {
    font-size: 0.82rem;
    color: var(--text-faint);
  }

  :is(.chip, button, textarea):focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  #error {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    font-size: 0.85rem;
    line-height: 1.5;
  }

  #result {
    margin-top: 18px;
    padding: 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.18s ease, transform 0.18s ease;
    display: none;
  }

  #result.show {
    display: block;
    opacity: 1;
    transform: translateY(0);
  }

  .result-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }

  .badge {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid transparent;
  }

  .badge-ok { color: var(--ok-text); background: var(--ok-bg); border-color: var(--ok-border); }
  .badge-review { color: var(--review-text); background: var(--review-bg); border-color: var(--review-border); }

  .review-note {
    font-size: 0.82rem;
    color: var(--review-text);
    margin-bottom: 14px;
    line-height: 1.5;
  }

  .confidence-label {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-faint);
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .confidence-track {
    height: 7px;
    border-radius: 999px;
    background: #eceef1;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .confidence-fill {
    height: 100%;
    border-radius: 999px;
    width: 0%;
    transition: width 0.35s ease;
  }

  .fill-ok { background: var(--ok-accent); }
  .fill-review { background: var(--review-accent); }

  .topk-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 8px;
  }

  .topk-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.85rem;
    padding: 5px 0;
  }

  .topk-category {
    flex: 1;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .topk-prob {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--text-faint);
    width: 44px;
    text-align: right;
  }

  footer {
    margin-top: 28px;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--text-faint);
    text-align: center;
    letter-spacing: 0.02em;
  }

  @media (max-width: 480px) {
    body { padding: 32px 14px 24px; }
    .card { padding: 16px; }
    .row { flex-wrap: wrap; }
    .hint { width: 100%; order: 2; }
  }
</style>
</head>
<body>
  <main>
    <div class="header">
      <div class="eyebrow">Ticket triage / internal tool</div>
      <h1>Support Ticket Classifier</h1>
      <p class="subhead">Paste a support ticket below and get its predicted category (77 banking intents). Low-confidence tickets are flagged for human review instead of guessed.</p>
    </div>

    <div class="card">
      <p class="section-label">Try an example</p>
      <div class="chips" id="chips">
        <button type="button" class="chip" data-text="I'm still waiting for my new card.">Card arrival</button>
        <button type="button" class="chip" data-text="I have a problem! The ATM stole my card!">Card swallowed</button>
        <button type="button" class="chip" data-text="How long does it take to show a deposit I made to my balance?">Deposit timing</button>
        <button type="button" class="chip" data-text="hello I have a question about something">Vague (triggers review)</button>
      </div>

      <textarea id="ticketText" placeholder="e.g. My card still hasn't arrived after two weeks"></textarea>

      <div class="row">
        <button id="submitBtn">Classify</button>
        <span class="hint" id="hint">Enter a ticket to classify</span>
      </div>

      <div id="error"></div>

      <div id="result">
        <div class="result-top">
          <span class="hint" style="font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.72rem;">Prediction</span>
          <span class="badge" id="badge"></span>
        </div>
        <p class="review-note" id="reviewNote" style="display: none;"></p>
        <div class="confidence-label">
          <span>Confidence</span>
          <span id="confidenceValue">—</span>
        </div>
        <div class="confidence-track">
          <div class="confidence-fill" id="confidenceFill"></div>
        </div>
        <p class="topk-label">Top candidates</p>
        <div id="topk"></div>
      </div>
    </div>
  </main>

  <script>
    const btn = document.getElementById("submitBtn");
    const textEl = document.getElementById("ticketText");
    const resultEl = document.getElementById("result");
    const errorEl = document.getElementById("error");
    const hintEl = document.getElementById("hint");
    const badgeEl = document.getElementById("badge");
    const reviewNoteEl = document.getElementById("reviewNote");
    const confidenceValueEl = document.getElementById("confidenceValue");
    const confidenceFillEl = document.getElementById("confidenceFill");
    const topkEl = document.getElementById("topk");
    const chipsEl = document.getElementById("chips");

    function resetPanels() {
      resultEl.classList.remove("show");
      errorEl.style.display = "none";
    }

    function labelFor(category) {
      return category.replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
    }

    async function classify() {
      const text = textEl.value.trim();
      resetPanels();

      if (!text) {
        hintEl.textContent = "Enter a ticket to classify";
        hintEl.style.display = "inline";
        return;
      }

      hintEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Classifying…";

      try {
        const res = await fetch("/classify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || "Classification failed.");
        }

        const state = data.needs_review ? "review" : "ok";

        badgeEl.classList.remove("badge-ok", "badge-review");
        confidenceFillEl.classList.remove("fill-ok", "fill-review");
        badgeEl.classList.add("badge-" + state);
        confidenceFillEl.classList.add("fill-" + state);
        badgeEl.textContent = data.needs_review ? "Needs review" : labelFor(data.category);

        if (data.needs_review) {
          reviewNoteEl.textContent = "The model wasn't confident enough to auto-classify this ticket. Route it to a person — here's what it considered:";
          reviewNoteEl.style.display = "block";
        } else {
          reviewNoteEl.style.display = "none";
        }

        const pct = Math.round(data.confidence * 100);
        confidenceValueEl.textContent = pct + "%";
        confidenceFillEl.style.width = pct + "%";

        topkEl.innerHTML = "";
        (data.top_k || []).forEach((item) => {
          const row = document.createElement("div");
          row.className = "topk-row";
          const cat = document.createElement("span");
          cat.className = "topk-category";
          cat.textContent = labelFor(item.category);
          const prob = document.createElement("span");
          prob.className = "topk-prob";
          prob.textContent = Math.round(item.probability * 100) + "%";
          row.appendChild(cat);
          row.appendChild(prob);
          topkEl.appendChild(row);
        });

        resultEl.classList.add("show");
      } catch (err) {
        errorEl.textContent = err.message || "Classification failed — check that the API server is running.";
        errorEl.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Classify";
      }
    }

    btn.addEventListener("click", classify);

    textEl.addEventListener("input", () => {
      if (textEl.value.trim()) {
        hintEl.style.display = "none";
      } else {
        hintEl.textContent = "Enter a ticket to classify";
        hintEl.style.display = "inline";
      }
    });

    chipsEl.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      textEl.value = chip.dataset.text;
      textEl.focus();
      classify();
    });
  </script>
</body>
</html>
